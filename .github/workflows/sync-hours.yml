name: Sync weekly work hours

on:
  schedule:
    # Avoid minute 0, 15, 30, and 45. Those are the crowded slots, and a dropped run is not retried.
    - cron: "23 5 * * *"   # 05:23 UTC (07:23 UTC+2)
    - cron: "47 15 * * *"  # 15:47 UTC (17:47 UTC+2), catch-up if the morning run is dropped
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync-hours/requirements.txt
      - run: pip install -r requirements.txt
      - run: python sync_hours.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          WORK_HOURS_DB_ID: ${{ secrets.WORK_HOURS_DB_ID }}
          SUMMARY_DB_ID: ${{ secrets.SUMMARY_DB_ID }}