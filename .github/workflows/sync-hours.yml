name: Sync weekly work hours

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync-hours/requirements.txt
      - run: pip install -r requirements.txt
      - run: python sync_hours.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          WORK_HOURS_DB_ID: ${{ secrets.WORK_HOURS_DB_ID }}
          SUMMARY_DB_ID: ${{ secrets.SUMMARY_DB_ID }}
